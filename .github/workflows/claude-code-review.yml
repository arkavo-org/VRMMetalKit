name: Claude Code Review

# NOTE ON VERIFYING CHANGES TO THIS FILE. `claude-code-action` refuses to run when this
# workflow differs from the copy on the default branch (a security property: otherwise any
# PR could rewrite the reviewer about to review it). Changes here CANNOT be tested on the
# PR that makes them — the job reports success while skipping the action entirely. Confirm
# on the next PR after merge, not this one.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # write is required for the action's buffered inline-comment mechanism — with
      # read the review runs but every comment post is denied and the flush step
      # ends with "No buffered inline comments".
      pull-requests: write
      issues: write # the heartbeat step posts/updates a status comment via the issues API
      id-token: write
      actions: read # let the review read CI results on the PR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        timeout-minutes: 20
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # `show_full_output` is deliberately NOT enabled here. It echoes the SDK stream —
          # including untrusted PR-head file contents — into the run log, and THIS REPOSITORY
          # IS PUBLIC, so that log is world-readable. The reference configuration this file is
          # adapted from turns it on and is explicit that doing so is safe only because that
          # repo is private. The diagnostics step below publishes only bounded
          # metadata from the execution file, never tool inputs or outputs.
          #
          # Consolidate any inline FINDINGS into a single PR comment. NOTE: this only merges
          # comments that exist — it never posts on a zero-finding review, so it is NOT a
          # per-run heartbeat. The always-on "Post review heartbeat" step below provides that.
          use_sticky_comment: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `--comment` IS NOT OPTIONAL AND IS NOT COSMETIC. Step 7 of the plugin's own
          # command (`plugins/code-review/commands/code-review.md` in anthropics/claude-code)
          # reads: "If `--comment` argument was NOT provided, stop here. Do not post any
          # GitHub comments." Without it the review runs fully, prints to a log nobody
          # watches, and exits green by design.
          #
          # Compound shell commands trigger permission prompts even when every program is
          # allow-listed: pipelines match each segment, `cd` compounds are rejected because
          # they can select git hooks, and shell keywords are parsed as command names
          # (anthropics/claude-code#32270). Keep the reviewer on simple commands instead of
          # expanding the allowlist with shell syntax and arbitrary keyword prefixes.
          #
          # Claude Code's command-injection checks also deny some shapes outright, whatever the
          # allowlist says: a quoted argument in which a newline is followed by `#`, `$(...)`,
          # and `{` followed by a quote. An inline multi-line `--body` takes the first shape as
          # soon as a Markdown heading or `#123` starts a later line, as the plugin's own
          # `---` / `## Code review` summary template does, so comment bodies go through
          # `--body-file -` with a quoted heredoc, which those checks accept for Markdown and
          # code (the brace check still scans the body, so a literal `{"` there is denied).
          # The plugin's subagents never see this prompt, so the reviewer must hand the rules on.
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            The working directory is already this repository. Use one simple command per Bash call: no `cd`, pipelines, redirects, `&&`, `||`, semicolons, loops, conditionals, or command substitution. Use Read, Grep, and Glob instead of shell text-processing pipelines. Run `gh` and `git` as standalone commands and pass `git -C <dir>` to target a subdirectory. If a command would need compound shell syntax, split it into separate tool calls. Never put a newline inside a quoted argument: post every comment body with `gh pr comment <number> --body-file - <<'EOF'`, the body on the following lines and `EOF` alone on the last line. That quoted heredoc is the only permitted redirect. Include these shell rules in the prompt of every subagent you launch.
          # `--allowedTools` IS REQUIRED, and the stock template's single-entry list is why
          # the first run here did nothing: with only the inline-comment tool allowed, the
          # reviewer had no Read, no Grep and no Bash, so it could not open the diff at all
          # and gave up after 2 turns.
          #
          # In agent mode (any invocation that passes a `prompt`) this list also decides WHICH
          # GitHub MCP servers get installed: the action prefix-matches entries (e.g.
          # `mcp__github_inline_comment__`) to start each server, so an empty list installs no
          # comment server and the tool the reviewer publishes with does not exist. Entries
          # must ALSO be exact tool names — `*` is not a wildcard in the permission syntax.
          #
          # `Bash(swift:*)` is deliberately absent: the review never needs a build, and the
          # checkout is untrusted PR head. `head`/`wc`/`sed`/`diff` are read-only in the
          # shapes a review uses (windowing, sizing and comparing files); note `sed -i` is
          # not, so this allowlist trusts the reviewer's intent rather than the tool's
          # inability to write, bounded by the runner being ephemeral. That is NOT a sandbox
          # claim.
          claude_args: >-
            --model claude-opus-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(gh:*),Bash(git:*),Bash(rg:*),Bash(find:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(wc:*),Bash(sed:*),Bash(diff:*),mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
          # Read-only text tools live here rather than in `--allowedTools` because the
          # one-line form trips GitGuardian's generic-password detector. `settings`
          # permissions merge with the CLI list; none of these entries needs MCP discovery.
          # Shell keywords and `cd` are deliberately not allowed: the prompt requires simple
          # commands, so a denial for those shapes identifies a review that ignored it.
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(grep:*)",
                  "Bash(tail:*)",
                  "Bash(cut:*)",
                  "Bash(sort:*)",
                  "Bash(uniq:*)",
                  "Bash(tr:*)",
                  "Bash(awk:*)",
                  "Bash(xargs:*)",
                  "Bash(jq:*)",
                  "Bash(echo:*)",
                  "Bash(printf:*)",
                  "Bash(pwd:*)",
                  "Bash(test:*)",
                  "Bash(basename:*)",
                  "Bash(dirname:*)",
                  "Bash(stat:*)",
                  "Bash(file:*)",
                  "Bash(tac:*)",
                  "Bash(nl:*)",
                  "Bash(paste:*)",
                  "Bash(comm:*)",
                  "Bash(true:*)",
                  "Bash(false:*)"
                ]
              }
            }
          additional_permissions: |
            actions: read

      - name: Inspect review completion
        id: diagnostics
        if: always()
        uses: actions/github-script@v7
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const file = process.env.EXECUTION_FILE || path.join(process.env.RUNNER_TEMP, 'claude-execution-output.json');
            let status = 'unavailable';
            let detail = 'No readable completion record; review coverage is unverified.';
            try {
              const records = JSON.parse(fs.readFileSync(file, 'utf8'));
              const messages = Array.isArray(records) ? records : [records];
              const result = messages.findLast(r => r.type === 'result');
              if (result) {
                const denials = Array.isArray(result.permission_denials) ? result.permission_denials : [];
                const count = Math.max(denials.length, Number.isSafeInteger(result.permission_denials_count) ? result.permission_denials_count : 0);
                const complete = result.subtype === 'success' && result.is_error === false;
                status = complete ? (count > 0 ? 'limited' : 'complete') : 'incomplete';
                detail = complete ? 'Review completed.' : 'Review did not complete successfully.';
                detail += ` Tool permission denials: ${count}.`;
                // Only fixed labels reach public logs; never echo tool inputs or output.
                const knownTools = new Set(['Read', 'Grep', 'Glob', 'Bash', 'Agent', 'Task', 'Edit', 'Write', 'WebFetch', 'WebSearch', 'Skill', 'TodoWrite', 'mcp__github_inline_comment__create_inline_comment', 'mcp__github_ci__get_ci_status', 'mcp__github_ci__get_workflow_run_details', 'mcp__github_ci__download_job_log']);
                const deniedTools = [...new Set(denials.map(d => knownTools.has(d.tool_name) ? d.tool_name : 'other'))];
                if (deniedTools.length) detail += ` Denied tools: ${deniedTools.join(', ')}.`;
                // The SDK's best-effort `permission_denied` frames name the deciding check and
                // the subagent; join them to the authoritative result list by tool_use_id.
                // Tool calls in assistant turns that carry a parent_tool_use_id are subagent
                // calls, which still identifies them when a frame is missing.
                const frames = new Map();
                const subagentCalls = new Set();
                for (const m of messages) {
                  if (m?.type === 'system' && m.subtype === 'permission_denied' && typeof m.tool_use_id === 'string') frames.set(m.tool_use_id, m);
                  if (m?.type === 'assistant' && m.parent_tool_use_id && Array.isArray(m.message?.content)) {
                    for (const block of m.message.content) if (block?.type === 'tool_use' && typeof block.id === 'string') subagentCalls.add(block.id);
                  }
                }
                // The check's message is mapped to a fixed label and never published itself.
                const reasonLabels = [
                  [/newline followed by #/i, 'quoted-newline-hash'],
                  [/quoted text/i, 'quoted-substitution'],
                  [/nested command/i, 'nested-command'],
                  [/brace with quote/i, 'brace-quote'],
                ];
                // Surface only program names and fixed shape labels, never arguments. Heredoc
                // bodies and quoted text are removed before splitting so prose such as
                // `echo "NEW; formerly ..."` or a comment body is not misreported as executables.
                const heredoc = /<<-?[ \t]*(['"]?)([A-Za-z_][A-Za-z0-9_]*)\1([^\n]*)\n[\s\S]*?\n[ \t]*\2(?=\n|$)/g;
                const quotedText = /'[^']*'|"(?:\\[\s\S]|[^"\\])*"|`(?:\\[\s\S]|[^`\\])*`/g;
                const programs = new Set();
                const shapes = new Set();
                const reasons = new Set();
                let inSubagents = 0;
                for (const d of denials) {
                  const frame = frames.get(d.tool_use_id);
                  if (frame?.agent_id || subagentCalls.has(d.tool_use_id)) inSubagents++;
                  if (frame) {
                    const why = typeof frame.decision_reason === 'string' ? frame.decision_reason : '';
                    const type = typeof frame.decision_reason_type === 'string' && /^[A-Za-z]{1,24}$/.test(frame.decision_reason_type) ? frame.decision_reason_type : 'other';
                    reasons.add(reasonLabels.find(([pattern]) => pattern.test(why))?.[1] ?? type);
                  }
                  if (d.tool_name !== 'Bash') continue;
                  const command = typeof d.tool_input?.command === 'string' ? d.tool_input.command : '';
                  const found = new Set();
                  const bodiless = command.replace(heredoc, (_, quote, tag, rest) => {
                    found.add('heredoc');
                    return `<<${tag}${rest}`;
                  });
                  const quoted = bodiless.match(quotedText) || [];
                  if (quoted.some(q => /\n[ \t]*#/.test(q))) found.add('quoted-newline-hash');
                  else if (quoted.some(q => q.includes('\n'))) found.add('quoted-newline');
                  if (/\$\(|`/.test(bodiless.replace(/'[^']*'/g, ''))) found.add('substitution');
                  if (/\{\s*["']/.test(command)) found.add('brace-quote');
                  const unquoted = bodiless.replace(quotedText, '');
                  if (/&&|\|\|/.test(unquoted)) found.add('and-or');
                  if (/(^|[^|])\|(?!\|)/.test(unquoted)) found.add('pipe');
                  if (unquoted.includes(';')) found.add('semicolon');
                  if (/[<>]/.test(unquoted.replace(/<<(?=[A-Za-z_])/g, ''))) found.add('redirect');
                  if (unquoted.trim().includes('\n')) found.add('multiline');
                  if (!found.size) found.add('simple');
                  for (const shape of found) shapes.add(shape);
                  for (const segment of unquoted.split(/\|\||&&|\||;|\n/)) {
                    const word = segment.trim().split(/\s+/)[0] || '';
                    if (/^[A-Za-z0-9_.\/-]{1,32}$/.test(word)) programs.add(word.replace(/^.*\//, ''));
                  }
                }
                if (programs.size) detail += ` Denied Bash programs: ${[...programs].sort().join(', ')}.`;
                if (shapes.size) detail += ` Denied Bash shapes: ${[...shapes].sort().join(', ')}.`;
                if (reasons.size) detail += ` Denial reasons: ${[...reasons].sort().join(', ')}.`;
                if (inSubagents) detail += ` Denials inside subagents: ${inSubagents}.`;
                if (Number.isSafeInteger(result.num_turns) && result.num_turns >= 0) detail += ` Turns: ${result.num_turns}.`;
                if (Number.isFinite(result.duration_ms) && result.duration_ms >= 0) detail += ` Duration: ${Math.round(result.duration_ms / 1000)}s.`;
              }
            } catch {
              // The raw exception may contain execution content; keep it private.
            }
            core.setOutput('status', status);
            core.setOutput('detail', detail);
            await core.summary.addHeading('Review execution').addRaw(detail).write();
            if (status === 'incomplete') core.setFailed(detail);
            else if (status !== 'complete') core.warning(detail);

      # Guaranteed per-run signal. The code-review plugin only comments on findings, and
      # use_sticky_comment merely consolidates those — so a clean review posts nothing and a
      # green check is indistinguishable from a "ran but failed to post" run, which is exactly
      # what the stock configuration produced on PR #413. This step ALWAYS posts/updates one
      # sticky comment with the review job's outcome, so a clean pass is visible and a broken
      # run is obvious.
      - name: Post review heartbeat
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- claude-review-heartbeat -->';
            const outcome = '${{ steps.claude-review.outcome }}'; // success | failure | cancelled | skipped
            const sha = (context.payload.pull_request?.head?.sha || context.sha).slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const diagnosticStatus = '${{ steps.diagnostics.outputs.status }}';
            const detail = '${{ steps.diagnostics.outputs.detail }}';
            const clean = outcome === 'success' && diagnosticStatus === 'complete';
            const emoji = clean ? '✅' : diagnosticStatus === 'limited' ? '⚠️' : '❌';
            const body = [
              marker,
              `${emoji} **Claude Code Review** ran on \`${sha}\` — result: **${outcome}**.`,
              detail || 'Completion diagnostics unavailable; review coverage is unverified.',
              '',
              clean ? 'The completed review reported no tool permission denials.' : 'Do not interpret missing findings as a clean review; inspect the execution diagnostics.',
              `Findings are posted as review comments. [Run log](${runUrl}).`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
